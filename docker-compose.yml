services:

  db:
    image: postgres:16
    container_name: dc_db
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  vault:
    image: hashicorp/vault
    container_name: dc_vault
    entrypoint: ["vault", "server", "-dev",
                 "-dev-root-token-id=${VAULT_TOKEN}",
                 "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DISABLE_MLOCK: "true"
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  vault-init:
    image: hashicorp/vault
    container_name: dc_vault_init
    # One-shot. Seeds all three secrets the application reads at startup:
    #   - secret/jwt    consumed by app/core/lifespan.py (JWT signing key)
    #   - secret/sftp   consumed by app/workers/sftp_ingest.py (paramiko creds)
    #   - secret/minio  consumed by app/workers/sftp_ingest.py (S3 creds)
    # Single source of truth is .env on the host; this service mirrors those
    # values into Vault so the application never reads passwords from env.
    entrypoint: >
      sh -c "
      vault kv put -address=http://vault:8200 secret/jwt   secret=dev-signing-key-change-in-prod &&
      vault kv put -address=http://vault:8200 secret/sftp  username=$$SFTP_USER       password=$$SFTP_PASSWORD &&
      vault kv put -address=http://vault:8200 secret/minio access_key=$$MINIO_ROOT_USER secret_key=$$MINIO_ROOT_PASSWORD
      "
    environment:
      VAULT_TOKEN:         ${VAULT_TOKEN}
      SFTP_USER:           ${SFTP_USER}
      SFTP_PASSWORD:       ${SFTP_PASSWORD}
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: .
      target: runtime-core
    container_name: dc_migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      VAULT_TOKEN:  ${VAULT_TOKEN}
      VAULT_ADDR:   http://vault:8200
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime-core
    container_name: dc_api
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      VAULT_TOKEN:  ${VAULT_TOKEN}
      VAULT_ADDR:   http://vault:8200
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  sftp:
    image: atmoz/sftp:latest
    container_name: dc_sftp
    # format: user:pass:uid::dirs
    command: "${SFTP_USER}:${SFTP_PASSWORD}:1001::upload,quarantine"
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - sftp-data:/home/scanner
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: dc_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: dc_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  worker-ingest:
    build:
      context: .
      target: runtime-core
    container_name: dc_worker_ingest
    command: ["python", "-m", "app.workers.sftp_ingest"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      VAULT_TOKEN:  ${VAULT_TOKEN}
      VAULT_ADDR:   http://vault:8200
      SFTP_HOST:    sftp
      SFTP_PORT:    "22"
      MINIO_ENDPOINT: minio:9000
      REDIS_URL:    redis://redis:6379/0
    depends_on:
      sftp:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: dc_frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # Inference worker. Same image as the ingest worker (model weights
  # are baked into the image via `app/classifier/models/classifier.pt`,
  # materialised by Git LFS at build time). depends_on `migrate` so we
  # never write into a stale schema, and on `vault-init` so the MinIO
  # creds are present in Vault before fetch_vault_secrets() runs.
  worker-inference:
    build:
      context: .
      target: runtime-ml
    container_name: dc_worker_inference
    command: ["python", "-m", "app.workers.inference"]
    environment:
      DATABASE_URL:   postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      VAULT_TOKEN:    ${VAULT_TOKEN}
      VAULT_ADDR:     http://vault:8200
      MINIO_ENDPOINT: minio:9000
      REDIS_URL:      redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  sftp-data:
  minio-data:
  redis-data:
  postgres-data:
